name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Quality gate: the latest Client Pulse edition must grade A across
      # accuracy / mix / relevancy / readability for every client
      # (scripts/EDITORIAL.md defines the contract). Below-A content
      # cannot deploy.
      - name: Grade Client Pulse content
        run: npm run grade
      # Anti-hallucination gate: every cited URL in the latest edition must
      # exist in the gather/session provenance record (deterministic, no
      # network). A fabricated citation blocks the deploy.
      - name: Verify citation provenance
        run: node scripts/verify.mjs --provenance-only
      # Static export can't include dynamic route handlers; the demo generates
      # the newsletter client-side, so drop the server-only API for Pages.
      - name: Remove server-only API routes
        run: rm -rf src/app/api
      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: "1"
      - name: Disable Jekyll
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
